<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Rev ❤️</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #ffeef2;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            overflow: hidden;
        }

        #container {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 400px;
            z-index: 10;
        }

        h1 { color: #d63384; margin-bottom: 10px; }
        p { font-size: 1.2rem; color: #555; }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
            height: 100px;
        }

        button {
            padding: 15px 25px;
            font-size: 1.1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #yesBtn {
            background-color: #4caf50;
            color: white;
        }

        #noBtn {
            background-color: #f44336;
            color: white;
            position: relative;
        }

        #message.hidden { display: none; }
        .celebration { font-size: 3rem; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="container">
        <div id="quiz">
            <div style="font-size: 4rem;">✨</div>
            <h1>Hey Rev!</h1>
            <p>I wanted to ask you something really important because you have such a good soul...</p>
            <p><strong>Will you be my friend forever?</strong></p>
            
            <div class="buttons">
                <button id="yesBtn">YES!</button>
                <button id="noBtn">No</button>
            </div>
        </div>

        <div id="message" class="hidden">
            <div class="celebration">🥳</div>
            <h1>Yay! Besties!</h1>
            <p>I knew you couldn't say no to this face! You're stuck with me, Rev! ✨</p>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const quiz = document.getElementById('quiz');
        const message = document.getElementById('message');

        let yesScale = 1;

        // The Runaway Logic
        const moveButton = () => {
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            
            noBtn.style.position = 'absolute';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';

            // Every time they try to click No, make Yes bigger!
            yesScale += 0.3;
            yesBtn.style.transform = `scale(${yesScale})`;
        };

        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('click', moveButton); // Just in case they are fast

        // Success Logic
        yesBtn.addEventListener('click', () => {
            quiz.classList.add('hidden');
            message.classList.remove('hidden');
            document.body.style.backgroundColor = "#ffdeeb";
        });
    </script>
</body>
</html>
